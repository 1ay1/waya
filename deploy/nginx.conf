# deploy/nginx.conf — a waya app behind nginx.
#
# nginx terminates TLS/HTTP2 and reverse-proxies HTTP/1.1 + WebSocket to the
# waya origin on 127.0.0.1:8080. The two things that matter for a live app:
#   (1) pass the WebSocket Upgrade through (proxy_http_version 1.1 + the
#       Connection map below), and
#   (2) set X-Forwarded-* so waya's redirects/cookies/logs know the real
#       client scheme, host and IP.
#
# Drop this in http{} (the `map` is http-level) and edit server_name / certs.

# Map the incoming Connection header: "upgrade" for a WebSocket, else keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Optional edge rate-limit (waya is an origin; do abuse control at the edge).
limit_req_zone $binary_remote_addr zone=waya:10m rate=50r/s;

upstream waya_origin {
    server 127.0.0.1:8080;
    keepalive 64;                 # pool upstream keep-alive connections
}

server {
    listen 443 ssl http2;
    server_name example.com;      # <-- your domain

    # ssl_certificate     /etc/ssl/certs/example.com.pem;
    # ssl_certificate_key /etc/ssl/private/example.com.key;

    # Let the edge serve compression; waya can also gzip (WAYA_GZIP) if you
    # prefer origin compression.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location / {
        limit_req zone=waya burst=100 nodelay;

        proxy_pass http://waya_origin;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;         # WebSocket upgrade
        proxy_set_header Connection $connection_upgrade;   # upgrade vs keep-alive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;        # so waya knows https
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout  3600s;     # keep long-lived live sockets open
        proxy_send_timeout  3600s;
    }

    # Liveness probe straight to the origin.
    location = /healthz {
        proxy_pass http://waya_origin;
        access_log off;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
