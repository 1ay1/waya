name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the whole tree with -Werror and run the full suite. This is the
  # correctness + warning-hygiene gate.
  build-and-test:
    name: build + test (-Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 15 (C++26)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake ninja-build
          echo "CXX=g++-15" >> "$GITHUB_ENV"
          echo "CC=gcc-15" >> "$GITHUB_ENV"

      - name: Configure (-Werror)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAYA_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Build the suite with ASan + UBSan and run it. Catches memory errors and
  # undefined behaviour in the render/diff path and the runtime.
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 15 (C++26)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake ninja-build
          echo "CXX=g++-15" >> "$GITHUB_ENV"
          echo "CC=gcc-15" >> "$GITHUB_ENV"

      - name: Configure (sanitizers)
        run: cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAYA_SANITIZE=ON

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Build the whole tree with -DWAYA_STRICT=ON + sanitizers and run it. Strict
  # mode ABORTS on any structural surface violation, so this proves every
  # example and test renders a well-formed surface (the "impossible UIs can't
  # ship" guarantee), and ASan+UBSan cover the parser fuzz loops on top.
  strict:
    name: strict render (WAYA_STRICT + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 15 (C++26)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake ninja-build
          echo "CXX=g++-15" >> "$GITHUB_ENV"
          echo "CC=gcc-15" >> "$GITHUB_ENV"

      - name: Configure (strict + sanitizers)
        run: cmake -S . -B build-strict -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAYA_STRICT=ON -DWAYA_SANITIZE=ON

      - name: Build
        run: cmake --build build-strict -j

      - name: Test
        run: ctest --test-dir build-strict --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Build with ThreadSanitizer and exercise the concurrent live runtime. The
  # multi-threaded connection handling (one thread per WS connection + the
  # broadcast Hub) must stay data-race-free under load.
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 15 (C++26)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake ninja-build
          echo "CXX=g++-15" >> "$GITHUB_ENV"
          echo "CC=gcc-15" >> "$GITHUB_ENV"

      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAYA_TSAN=ON

      - name: Build
        run: cmake --build build-tsan -j

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  # Build the whole tree with -DWAYA_NO_RAW_CSS=ON. This makes the raw css()/var()
  # escape hatches compile errors, so a clean build PROVES every example and test
  # is written purely in the named vocabulary — zero hand-written HTML/CSS leaked
  # in. It's the enforcement teeth behind "you never touch HTML/CSS."
  no-raw-css:
    name: pure vocabulary (WAYA_NO_RAW_CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 15 (C++26)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 cmake ninja-build
          echo "CXX=g++-15" >> "$GITHUB_ENV"
          echo "CC=gcc-15" >> "$GITHUB_ENV"

      - name: Configure (no raw CSS)
        # Tests OFF: the test suite legitimately EXERCISES css()/var() (they're
        # public API); this gate is about APP code, so it builds the examples.
        run: cmake -S . -B build-purecss -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWAYA_NO_RAW_CSS=ON -DWAYA_BUILD_TESTS=OFF

      - name: Build every example — must compile with no raw css()/var()
        run: cmake --build build-purecss -j
